        metaphor_desc: "1. 練大腿前側中央 ➔ 像在向下手扶梯原地踏步（無效功）；改練外側踏階。<br>2. 練小腿彈射 ➔ 要拉長彈弓上的大橡皮筋，做 4 秒離心拉伸。<br>3. 落地起跳 ➔ 不要當硬水泥地，要像壓彈簧床一樣深屈蓄力。<br>4. 練核心腹肌 ➔ 核心是不鏽鋼吸管，防漏氣防受傷，但動力來自臀腿。<br>5. 練後恢復 ➔ 剛升好烤肉炭火，別拿滅火器（維他命C/E）噴冷水。",
        extra_knowledge_title: "肌力重訓與跳躍訓練的「4 小時隔離原則」",
        extra_knowledge_body: "大重量深蹲會啟動肌肉內的 mTOR 途徑，並帶來暫時性運動神經疲勞。若想在同一天進行高質量的增強式彈跳或扣球練習，兩者之間務必間隔 4 到 6 小時以上，或安排在不同天，才能確保起跳離地速度（Takeoff Velocity）不被肌力疲勞所干擾！",
        academic: {
          paper: "綜合自專案 Wiki 知識庫 (volleyball-vertical-jump-mastery.md)",
          points: [
            "週一課表：股外側肌肥大（高踏階 80% 1RM） + 40cm 長-SSC 深跳（著重推蹬衝量）",
            "週三課表：短-SSC 快速攔網彈跳（GCT < 188ms） + 4 秒小腿直膝離心下墜",
            "週五課表：8 週增強式漸進耐力循環 + 前蹲舉（82.5% 1RM） + 核心抗旋轉",
            "營養整合：每日肌酸 5g + β-丙氨酸 4g + 賽前咖啡因 4mg/kg"
          ]
        }
      }
    ];

    let currentSlideIndex = 0;
    let professorDrawerVisible = false;

    function renderSlide(index) {
      currentSlideIndex = index;
      const data = SLIDES_CONTENT[index];

      // Update Tag and Counter
      document.getElementById('slide-tag').innerText = data.tag;
      document.getElementById('slide-counter').innerText = `0${data.id} / 08`;

      // Render 2-Column Balanced Widescreen Layout
      const body = document.getElementById('slide-body');
      body.innerHTML = `
        <div class="h-full flex flex-col justify-between">
          
          <!-- Top Title & Punchline -->
          <div class="mb-3">
            <h2 class="text-xl md:text-2xl font-black text-slate-900 tracking-tight leading-tight mb-2">
              ${data.title}
            </h2>
            <div class="p-2.5 bg-teal-50 border-l-4 border-teal-600 rounded-r-lg text-xs md:text-sm font-bold text-teal-900">
              ${data.punchline}
            </div>
          </div>

          <!-- Main Content: Balanced 2-Column Cards -->
          <div class="grid grid-cols-1 md:grid-cols-12 gap-4 items-stretch mb-3">
            
            <!-- Left Card (7 cols): Everyday Metaphor -->
            <div class="md:col-span-7 p-4 rounded-xl bg-amber-50/90 border border-amber-200 text-amber-950 shadow-sm flex flex-col justify-between">
              <div>
                <div class="text-xs font-black text-amber-800 uppercase tracking-wider mb-1.5 flex items-center space-x-1">
                  <span>💡</span>
                  <span>${data.metaphor_title}</span>
                </div>
                <p class="text-xs md:text-sm text-amber-950 leading-relaxed font-medium">
                  ${data.metaphor_desc}
                </p>
              </div>
            </div>

            <!-- Right Card (5 cols): Supplementary Knowledge (Replaced Script) -->
            <div class="md:col-span-5 p-4 rounded-xl bg-slate-50 border border-slate-200 text-slate-800 shadow-sm flex flex-col justify-between">
              <div>
                <div class="text-xs font-black text-indigo-700 uppercase tracking-wider mb-1.5 flex items-center space-x-1">
                  <span>📌</span>
                  <span>${data.extra_knowledge_title}</span>
                </div>
                <p class="text-xs text-slate-600 leading-relaxed">
                  ${data.extra_knowledge_body}
                </p>
              </div>
            </div>

          </div>

          <!-- Professor Drawer Content -->
          <div id="professor-drawer" class="drawer ${professorDrawerVisible ? 'open' : ''}">
            <div class="p-3.5 rounded-xl bg-slate-950 text-slate-200 border border-slate-800 text-xs font-mono space-y-1.5">
              <div class="text-sky-300 font-bold">🎓 ${data.academic.paper}</div>
              <ul class="list-disc list-inside space-y-0.5 text-slate-300 text-[11px]">
                ${data.academic.points.map(p => `<li>${p}</li>`).join('')}
              </ul>
            </div>
          </div>

        </div>
      `;
    }

    function nextSlide() {
      if (currentSlideIndex < SLIDES_CONTENT.length - 1) {
        currentSlideIndex++;
      } else {
        currentSlideIndex = 0; // Loop back
      }
      renderSlide(currentSlideIndex);
    }

    function prevSlide() {
      if (currentSlideIndex > 0) {
        currentSlideIndex--;
        renderSlide(currentSlideIndex);
      }
    }

    function toggleProfessorDrawer() {
      professorDrawerVisible = !professorDrawerVisible;
      const drawer = document.getElementById('professor-drawer');
      const icon = document.getElementById('drawer-btn-icon');
      if (drawer) {
        if (professorDrawerVisible) {
          drawer.classList.add('open');
          if (icon) icon.innerText = '▲';
        } else {
          drawer.classList.remove('open');
          if (icon) icon.innerText = '▼';
        }
      }
    }

    // Keyboard Navigation
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') {
        e.preventDefault();
        nextSlide();
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevSlide();
      } else if (e.key.toLowerCase() === 'd') {
        e.preventDefault();
        toggleProfessorDrawer();
      } else {
        const num = parseInt(e.key);
        if (num >= 1 && num <= 8) {
          renderSlide(num - 1);
        }
      }
    });

    // Initial render
    renderSlide(0);
  </script>
</body>
</html>
